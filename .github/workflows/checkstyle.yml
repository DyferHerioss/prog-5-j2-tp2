name: Checkstyle

on:
  push:
    branches:
      - preprod
  pull_request:
    branches:
      - preprod

jobs:
  checkstyle:
    name: Run Checkstyle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Run Gradle Checkstyle
        run: ./gradlew checkstyleMain
